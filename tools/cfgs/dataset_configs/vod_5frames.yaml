# VoD 5-scan radar. Override root with env MAMBANET4D_DATA or DATA_PATH.
DATASET: 'vodDataset_Temporal'
DATA_PATH: 'data/vod/radar_5frames'

POINT_CLOUD_RANGE: [0, -25.6, -3, 51.2, 25.6, 2]

DATA_SPLIT: {
    'train': train,
    'test': val
}

INFO_PATH: {
    'train': [vod_infos_train_temporal.pkl],
    'test': [vod_infos_val_temporal.pkl],
}

# Trailing slashes required (vod_dataset_temporal concatenates clip_path + name + '.txt').
lidar_path: data/vod/lidar/
clip_path: data/vod/radar_5frames/clips/

FOV_POINTS_ONLY: True

DATA_AUGMENTOR:
    DISABLE_AUG_LIST: ['placeholder']
    AUG_CONFIG_LIST:
        - NAME: random_world_flip
          ALONG_AXIS_LIST: ['x']

        - NAME: random_world_scaling
          WORLD_SCALE_RANGE: [0.95, 1.05]

POINT_FEATURE_ENCODING: {
    encoding_type: absolute_coordinates_encoding,
    used_feature_list: ['x', 'y', 'z', 'rcs', 'v_r', 'v_r_comp', 'time', 'tem_idx'],
    src_feature_list: ['x', 'y', 'z', 'rcs', 'v_r', 'v_r_comp', 'time', 'tem_idx'],
}

DATA_PROCESSOR:
    - NAME: mask_points_and_boxes_outside_range
      REMOVE_OUTSIDE_BOXES: True

    - NAME: shuffle_points
      SHUFFLE_ENABLED: {
        'train': True,
        'test': False,
      }
